# Incremental type checking.
#
# Only the files listed in `project-includes` are checked, and they are checked
# at `strict`. This is deliberate: rather than turning the checker on across the
# whole codebase at once, modules are opted in one at a time as they're cleaned
# up, so the type coverage grows gradually and each step stays reviewable.
#
# See CLAUDE.md ("Type checking") before adding an entry.
