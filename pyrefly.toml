# Incremental type checking.
#
# Only the files listed in `project-includes` are checked, and they are checked
# at `strict`. This is deliberate: rather than turning the checker on across the
# whole codebase at once, modules are opted in one at a time as they're cleaned
# up, so the type coverage grows gradually and each step stays reviewable.
#
# See CLAUDE.md ("Type checking") before adding an entry.
preset = "strict"

project-includes = [
    "cogs/server_draft_stats.py",
    "draft_organization/bracket.py",
    "helpers/draft_outcome.py",
    "helpers/draft_rooms.py",
    "services/draft_pool_service.py",
    "services/draft_reconstruct.py",
    "services/draft_table_page.py",
    "services/draft_table_publisher.py",
    "helpers/match_control.py",
    "helpers/opponent_threads.py",
    "helpers/scryfall_oracle.py",
    "helpers/team_names.py",
    "helpers/room_regeneration.py",
    "helpers/utils.py",
    "helpers/view_dispatch_guard.py",
    "match_control_view.py",
    "ready_check.py",
    "database/retry.py",
    "services/stake_funding.py",
    "services/tournament_roles.py",
]

# SQLAlchemy 1.x-style Column() declarations type column attributes as Column[T]
# rather than T, which would produce a false positive on every model attribute
# access.
replace-imports-with-any = ["sqlalchemy"]

# Resolve first-party imports from the project root.
search-path = ["."]
